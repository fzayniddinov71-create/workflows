name: Guruhga kunlik xabar yuborish

on:
  schedule:
    # ═══════════════════════════════════════════════════════════════
    # DIQQAT: GitHub cron vaqtni faqat UTC bo'yicha qabul qiladi.
    # Toshkent vaqti UTC dan 5 soat oldinda (UTC+5).
    # Shuning uchun Toshkent vaqtidan HAR DOIM 5 soat AYIRIB yozilgan.
    #
    # Cron formati: "daqiqa soat kun-raqami oy hafta-kuni"
    # Hafta kunlari: 0=Yakshanba, 1=Dush, 2=Sesh, 3=Chor, 4=Pay, 5=Juma, 6=Shanba
    # ═══════════════════════════════════════════════════════════════

    - cron: '02 12 * * 1-5'
      # Bu yerda: 30-daqiqa, 2-soat (UTC) => Toshkentda 07:30
      # "1-5" => Dushanbadan Jumagacha
      # → SALOMLASHISH xabari

    - cron: '50 2 * * 1-5'
      # 50-daqiqa, 2-soat (UTC) => Toshkentda 07:50 (soat 8 ga 10 daqiqa qolganda)
      # "1-5" => Dushanbadan Jumagacha
      # → "DARSGA KECHIKMANG" ogohlantirishi

    - cron: '0 4 * * 0,6'
      # 0-daqiqa, 4-soat (UTC) => Toshkentda 09:00
      # "0,6" => Yakshanba va Shanba
      # → DAM OLISH xabari

    # Vaqtni o'zgartirmoqchi bo'lsangiz: kerakli Toshkent vaqtidan 5 soat
    # ayirib, o'sha raqamni "soat" o'rniga yozing. Masalan, Toshkentda
    # 08:15 kerak bo'lsa → UTC bo'yicha 03:15 → cron: '15 3 * * 1-5'
  workflow_dispatch:          # Qo'lda ham ishga tushirish uchun (test qilish uchun)
    inputs:
      xabar_turi:
        description: "Test uchun xabar turi"
        required: true
        default: "salom"
        type: choice
        options:
          - salom
          - ogohlantirish
          - dam_olish

jobs:
  send-message:
    runs-on: ubuntu-latest
    steps:
      - name: Xabar yuborish
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          MANUAL="${{ github.event.inputs.xabar_turi }}"

          if [ "$SCHEDULE" = "02 12 * * 1-5" ] || [ "$MANUAL" = "salom" ]; then
            TEXT="Assalomu alaykum, yaxshimisizlar? 😊 Yangi kun, yangi kayfiyat bilan!"
          elif [ "$SCHEDULE" = "50 2 * * 1-5" ] || [ "$MANUAL" = "ogohlantirish" ]; then
            TEXT="Diqqat, guruh! 📢 Darsga kechikmasdan kelinglar, dars boshlanishiga oz vaqt qoldi ⏰"
          elif [ "$SCHEDULE" = "0 4 * * 0,6" ] || [ "$MANUAL" = "dam_olish" ]; then
            TEXT="Assalomu alaykum! 😊 Dam olish kuni yaxshi o'tyaptimi? Yaxshilab dam oling, kuch to'plang! 🌿"
          else
            TEXT="Assalomu alaykum!"
          fi

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="${TEXT}"

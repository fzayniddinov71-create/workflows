name: Guruhga kunlik xabar yuborish

on:
  schedule:
    # TEST UCHUN VAQTINCHA VAQTLAR (Toshkent bo'yicha, bugun uchun har kuni ishlaydi):
    - cron: '20 12 * * *'   # Toshkent 17:20 => salomlashish
    - cron: '22 12 * * *'   # Toshkent 17:22 => ogohlantirish
    - cron: '24 12 * * *'   # Toshkent 17:24 => dam olish
  workflow_dispatch:
    inputs:
      xabar_turi:
        description: "Test uchun xabar turi"
        required: true
        default: "salom"
        type: choice
        options:
          - salom
          - ogohlantirish
          - damolish

jobs:
  salomlashish:
    runs-on: ubuntu-latest
    if: github.event.schedule == '20 12 * * *' || github.event.inputs.xabar_turi == 'salom'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_message.py salom

  ogohlantirish:
    runs-on: ubuntu-latest
    if: github.event.schedule == '22 12 * * *' || github.event.inputs.xabar_turi == 'ogohlantirish'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_message.py ogohlantirish

  damolish:
    runs-on: ubuntu-latest
    if: github.event.schedule == '24 12 * * *' || github.event.inputs.xabar_turi == 'damolish'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_message.py damolish
